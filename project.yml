name: HelmMirror

options:
  bundleIdPrefix: com.jimmy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Xcode 15+; MobileVLCKit is integrated by CocoaPods (see Podfile + README).

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # <-- set your Apple Developer Team ID in Xcode Signing.
    CODE_SIGN_STYLE: Automatic

targets:

  # ---------------------------------------------------------------------------
  # The iOS app. Sources/ contains HelmProtocol.swift + all app-layer files,
  # all compiled directly into the app module — so app-layer files reference the
  # shared types WITHOUT `import HelmProtocol`.
  #
  # Deliberately NOT also linking the local HelmProtocol SwiftPM product: that
  # would compile HelmProtocol.swift a second time into a separate module, and
  # the moment any app file added `import HelmProtocol` every shared type would
  # become "ambiguous for type lookup". Package.swift builds that module only for
  # the standalone macOS verification path (`swift run helmverify`).
  # MobileVLCKit is integrated by CocoaPods (see Podfile + README).
  # ---------------------------------------------------------------------------
  HelmMirror:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimmy.helmmirror
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist                 # generated by XcodeGen from the keys below
      properties:
        CFBundleDisplayName: HelmMirror
        UILaunchScreen: {}
        # Helm mirroring is landscape; the MFD frame is 1280x720.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # --- Local Network (Bonjour) ---
        NSLocalNetworkUsageDescription: >-
          HelmMirror connects to your Garmin chartplotter over the boat's Wi-Fi
          to mirror and control the helm display.
        NSBonjourServices:
          - _garmin-helm._tcp
          - _garmin-bl-id._tcp
        # --- ATS: allow plaintext HTTP to the plotter's on-device nginx ---
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # NOTE: there is deliberately NO macOS unit-test target here.
  # The wire core is verified through the root Package.swift instead:
  #     swift run helmverify   (Foundation-only; works with Command Line Tools)
  #     swift test             (XCTest; needs full Xcode)
  # An XcodeGen test target that inlined Sources/HelmProtocol.swift could not
  # satisfy the test file's `@testable import HelmProtocol` (the file would be
  # compiled into the test bundle's own module, so no such module would exist),
  # so that path was removed rather than left broken.

schemes:
  HelmMirror:
    build:
      targets:
        HelmMirror: all
    run:
      config: Debug
